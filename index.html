<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>自動棋譜再生システム</title>
<link rel="stylesheet" href="./control.css?v=102">
</head>
<body>
<main class="control-shell">
  <header class="control-header">
    <h1>自動棋譜再生システム <span>操作画面</span></h1>
    <div class="control-header-actions">
      <a class="display-link" href="./display.html" target="_blank" rel="noopener">配信画面を開く ↗</a>
      <div id="connection" class="connection offline" hidden>DISCONNECTED</div>
    </div>
  </header>

  <section class="mode-card">
    <div class="playback-buttons">
      <button id="autoNormalModeBtn">等倍 ▶</button>
      <button id="autoDoubleModeBtn">倍速 ▶</button>
      <button id="autoTripleModeBtn">3倍 ▶</button>
      <button id="autoSixModeBtn">6倍 ▶</button>
      <button id="prevBtn">前へ</button>
      <button id="nextBtn">次へ</button>
      <button id="pauseBtn" class="active">停止</button>
    </div>
  </section>

  <section class="status-card">
    <div class="status-summary">
      <span>位置</span><strong id="stepText">1 / 1</strong>
      <span class="status-divider">ゲーム</span><strong id="gamePosition">1 / 1</strong>
      <span class="status-divider">残時間</span><strong id="remainingTime">0:00</strong>
    </div>
    <div class="timeline-block">
      <div class="timeline-wrap">
        <div id="gameMarkers" class="game-markers"></div>
        <input id="timeline" type="range" min="0" max="0" step="1" value="0" aria-label="棋譜位置">
      </div>
    </div>
    <div class="loaded-file">
      <span>PAGES MODE</span>
      <strong id="loadedFileName">未選択</strong>
    </div>
  </section>

  <section class="meta-card">
    <div class="match-file-row">
      <label class="match-file-field">
        <select id="matchFileSelect" aria-label="棋譜ファイル">
          <option value="">(未選択)</option>
        </select>
      </label>
      <div class="match-actions">
        <button id="refreshMatchesBtn">棋譜一覧更新</button>
        <button id="applyMetaBtn" class="primary">配信画面反映</button>
      </div>
    </div>
    <div class="meta-grid">
      <label>
        <span>試合名</span>
        <input id="tournamentLine1Input" type="text" value="">
      </label>
      <label>
        <span>試合補足</span>
        <input id="tournamentLine2Input" type="text" value="">
      </label>
      <label>
        <span>選手1</span>
        <input id="blackNameInput" type="text" value="">
      </label>
      <label>
        <span>選手2</span>
        <input id="whiteNameInput" type="text" value="">
      </label>
      <label>
        <span>テーマカラー</span>
        <div class="theme-color-input-row">
          <input id="themeColorInput" type="text" value="#000000" placeholder="#000000" maxlength="7" spellcheck="false">
          <span id="themeColorSwatch" class="theme-color-swatch" aria-label="入力中のテーマカラー"></span>
        </div>
        <div id="themeColorPreview" class="theme-color-preview" aria-label="テーマカラーのプリセット">
          <!-- common/brand.json からブランドカラーを生成します（通信失敗時はJSの控えを使用）。 -->
        </div>
      </label>
      <label>
        <span>ボードデザイン</span>
        <select id="designPresetSelect">
          <option value="green">グリーン</option>
        </select>
        <div id="designPresetPreview" class="design-preset-preview" aria-label="選択中デザインの配色"></div>
        <div id="designColorEditor" class="design-color-editor">
          <span id="designColorLabel" class="design-color-label">盤面</span>
          <input id="designColorInput" type="text" value="" placeholder="#RRGGBB" maxlength="7" spellcheck="false" aria-label="選択項目のカラーコード">
          <span id="designColorSwatch" class="design-color-swatch" aria-label="選択項目の色"></span>
          <button id="designColorNoneBtn" type="button">色なし</button>
        </div>
      </label>
    </div>
  </section>

  <section class="info-card">
    <div class="runtime-url-grid">
      <div class="runtime-url-item">
        <p>OBS Browser Source</p>
        <code id="obsBrowserSourceUrl"></code>
      </div>
      <div class="runtime-url-item">
        <p>操作画面URL</p>
        <code id="controlPageUrl"></code>
      </div>
    </div>
  </section>
</main>
<script src="./brand-theme.js?v=102"></script>
<script src="./control.js?v=102"></script>
</body>
</html>
